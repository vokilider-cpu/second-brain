name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: pip install "flet[all]"

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1 || true

      - name: Build APK
        run: flet build apk --yes --verbose
        env:
          CI: true
          FLET_CLI_NO_RICH_OUTPUT: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-apk
          path: build/apk/*.apk
