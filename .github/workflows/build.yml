name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Устанавливаем Java (необходим для Android)
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Устанавливаем Python для Flet
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Устанавливаем Android SDK с автоматическим принятием лицензий
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 4. Устанавливаем Flet
      - name: Install Flet
        run: pip install "flet[all]"

      # 5. Собираем APK
      - name: Build APK
        run: flet build apk --yes --verbose
        env:
          CI: true

      # 6. Сохраняем готовый APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-apk
          path: build/apk/*.apk
